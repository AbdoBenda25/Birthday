<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Birth Day</title>
    <link href="style.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
</head>
<body>
      <div id="header">
            <h1>Yesterday is Omar's birthday 🎉</h1>
            <img id="pfp" src="Images/pfp.jpg">
            <h2 id="age">20 Years old</h2>
            <h3 id="date">26/9/2006</h3>
      </div>
      <div class="img-set">
            <h3>What is his Job🤔</h3>
            <div id="job-img" class="imgs"></div>
      </div>
       <div class="img-set">
            <h3>How is his Build</h3>
            <div id="gym-img" class="imgs"></div>
      </div>

      <div class="img-set">
            <h3 id="ginger-text">What Makes him Speical👌</h3>
            <div id="hair-img" class="imgs" onmouseover=change()  onmouseleave=def()></div>
      </div>
      
      <div class="img-set">
            <h3>What's his Favorite Artist🎤</h3>
            <div id="singer-img" class="imgs"></div>
      </div>
      <div class="img-set">
            <h3>What does he want?</h3>     
            <div id="feet-img" class="imgs" onmouseover=changeBack() onmouseleave=preBack()></div>
      </div>

      <script src="code.js"></script>
</body>
</html>
